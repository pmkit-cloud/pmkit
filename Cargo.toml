[workspace]
members = ["crates/pmkit-core", "crates/pmkit-market", "crates/pmkit-math", "crates/pmkit-book", "crates/pmkit-exec", "crates/pmkit-polymarket", "crates/pmkit-strategy", "crates/pmkit-money", "crates/pmkit-accounting", "crates/pmkit-runtime", "crates/pmkit-run", "crates/pmkit-event", "crates/pmkit-data", "crates/pmkit-sim", "crates/pmkit-paper", "crates/pmkit-spec", "crates/pmkit", "crates/pmkit-tape", "crates/pmkit-manifest", "crates/pmkit-store", "crates/pmkit-api", "crates/pmkit-collector", "crates/pmkit-archive", "crates/pmkit-strategy-testkit"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"
version = "0.1.0"
authors = ["The PMKit Authors"]
homepage = "https://pmkit.cloud"
repository = "https://github.com/pmkit-cloud/pmkit"
readme = "README.md"
keywords = ["polymarket", "prediction-markets", "trading", "backtest", "sdk"]
categories = ["finance", "api-bindings"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde", "maths"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
# Pinned exactly: pmkit-polymarket works around this SDK version emitting GTD
# expirations as whole seconds while the CLOB v2 backend expects milliseconds
# (see `gtd_expiration` in crates/pmkit-polymarket/src/execution.rs). Re-verify
# that workaround before any bump: an SDK that converts to milliseconds itself
# would double-convert and produce orders that effectively never expire.
polymarket-client-sdk-v2 = { git = "https://github.com/yovanoc/rs-clob-client-v2", rev = "7997eef5921a34bb08fdaef0ec68a50dbfde2ec6", package = "polymarket_client_sdk_v2", features = ["gamma", "clob", "ws", "rtds"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
