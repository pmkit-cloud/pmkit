[workspace]
members = ["crates/pmkit-core", "crates/pmkit-market", "crates/pmkit-math", "crates/pmkit-book", "crates/pmkit-exec", "crates/pmkit-polymarket", "crates/pmkit-strategy", "crates/pmkit-money", "crates/pmkit-runtime", "crates/pmkit-run"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"
version = "0.1.0"
authors = ["The PMKit Authors"]
homepage = "https://pmkit.cloud"
repository = "https://github.com/pmkit-cloud/pmkit"
readme = "README.md"
keywords = ["polymarket", "prediction-markets", "trading", "backtest", "sdk"]
categories = ["finance", "api-bindings"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde", "maths"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
